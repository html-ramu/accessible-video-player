<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Blind Player" />
  <title>Accessible TalkBack Video Player</title>
  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --yellow: #FFD600;
      --white: #FFFFFF;
      --cyan: #00E5FF;
      --green: #00E676;
      --border: 4px solid #FFD600;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* TOP BAR: Video Info & Setup Buttons */
    header {
      padding: 10px 12px;
      background: var(--card);
      border-bottom: 3px solid #333;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    #trackTitle {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .loader-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .top-btn {
      background: #1F1F1F;
      color: var(--white);
      border: 3px solid var(--cyan);
      border-radius: 12px;
      padding: 12px 8px;
      font-size: 1rem;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
    }

    .top-btn:focus, .top-btn:active {
      outline: 4px solid var(--yellow);
      background: #004D40;
    }

    /* VIDEO PREVIEW (Compact so Center Buttons stay huge) */
    .video-container {
      position: relative;
      width: 100%;
      height: 18dvh;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #222;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* GIANT CENTER CONTROL PAD FOR TALKBACK */
    main.center-controls {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 12px;
      padding: 14px 12px;
      align-items: stretch;
    }

    .ctrl-btn {
      background: var(--card);
      color: var(--white);
      border: var(--border);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 900;
      cursor: pointer;
      padding: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.8);
    }

    .ctrl-btn .icon {
      font-size: 2.8rem;
      line-height: 1;
    }

    .ctrl-btn .label {
      font-size: 1.3rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }

    #playPauseBtn {
      background: var(--yellow);
      color: #000000;
      border: 5px solid var(--white);
    }

    #playPauseBtn .icon {
      font-size: 3.6rem;
    }

    #playPauseBtn .label {
      font-size: 1.6rem;
    }

    .ctrl-btn:focus-visible, .ctrl-btn:active {
      outline: 6px solid var(--cyan);
      transform: scale(0.98);
    }

    /* BOTTOM BAR: Speak Status & Clear Library */
    footer {
      padding: 10px 12px 14px;
      background: var(--card);
      border-top: 3px solid #333;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .bottom-btn {
      background: #1A1A1A;
      color: var(--green);
      border: 3px solid var(--green);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .clear-btn {
      color: #FF8A80;
      border-color: #FF5252;
      font-size: 0.95rem;
    }

    /* Screen Reader Live Announcer */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>

  <!-- Hidden Screen Reader Live Region -->
  <div id="liveAnnouncer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- Hidden File Inputs -->
  <input type="file" id="videoInput" accept="video/*,audio/*" multiple hidden />
  <input type="file" id="folderInput" webkitdirectory directory multiple hidden />

  <header>
    <div class="status-bar">
      <div id="trackTitle" aria-live="polite">Loading saved videos...</div>
    </div>
    <div class="loader-row">
      <button type="button" class="top-btn" id="pickVideosBtn" aria-label="Add Videos from Phone Gallery. Automatically saves them so they load every time you open the app.">
        + Add Phone Videos
      </button>
      <button type="button" class="top-btn" id="pickFolderBtn" aria-label="Scan Entire Video Folder. Pick any folder and automatically load all videos inside it.">
        Scan Video Folder
      </button>
    </div>
  </header>

  <div class="video-container">
    <video id="videoPlayer" playsinline preload="metadata"></video>
  </div>

  <!-- GIANT CENTER CONTROLS FOR BLIND USER -->
  <main class="center-controls" role="region" aria-label="Main Video Controls">
    <button type="button" id="prevBtn" class="ctrl-btn" aria-label="Previous Video">
      <span class="icon" aria-hidden="true">⏮</span>
      <span class="label">Previous</span>
    </button>

    <button type="button" id="playPauseBtn" class="ctrl-btn" aria-label="Play Video">
      <span class="icon" id="playIcon" aria-hidden="true">▶</span>
      <span class="label" id="playLabel">Play</span>
    </button>

    <button type="button" id="nextBtn" class="ctrl-btn" aria-label="Next Video">
      <span class="icon" aria-hidden="true">⏭</span>
      <span class="label">Next</span>
    </button>
  </main>

  <footer>
    <button type="button" id="speakInfoBtn" class="bottom-btn" aria-label="Speak current video name and time progress">
      🔊 Speak Video Info
    </button>
    <button type="button" id="clearSavedBtn" class="bottom-btn clear-btn" aria-label="Reset and clear saved phone videos">
      Reset List
    </button>
  </footer>

  <script>
    // Default Sample Videos (Used only if no phone videos are saved yet)
    const SAMPLE_VIDEOS = [
      {
        title: "Sample 1 - Nature Stream",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        isSample: true
      },
      {
        title: "Sample 2 - Coastal Waves",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        isSample: true
      },
      {
        title: "Sample 3 - Mountain Drive",
        url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
        isSample: true
      }
    ];

    let playlist = [];
    let currentIndex = 0;

    const videoPlayer = document.getElementById('videoPlayer');
    const prevBtn = document.getElementById('prevBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const liveAnnouncer = document.getElementById('liveAnnouncer');
    const pickVideosBtn = document.getElementById('pickVideosBtn');
    const pickFolderBtn = document.getElementById('pickFolderBtn');
    const videoInput = document.getElementById('videoInput');
    const folderInput = document.getElementById('folderInput');
    const speakInfoBtn = document.getElementById('speakInfoBtn');
    const clearSavedBtn = document.getElementById('clearSavedBtn');

    // --- TACTILE BEEP FOR BLIND FEEDBACK ---
    function playTone(freq = 520, duration = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function announce(message) {
      liveAnnouncer.textContent = '';
      setTimeout(() => {
        liveAnnouncer.textContent = message;
      }, 50);
    }

    // --- INDEXEDDB: AUTO-LOAD SAVED PHONE VIDEOS EVERY TIME APP OPENS ---
    const DB_NAME = 'AccessibleVideoPlayerDB';
    const STORE_NAME = 'savedVideos';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveVideosToPhoneDB(filesArray) {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear(); // Replace old playlist with newly selected phone videos
        for (const file of filesArray) {
          store.add({
            title: file.name.replace(/\.[^/.]+$/, ""),
            blob: file
          });
        }
        return new Promise((res) => {
          tx.oncomplete = () => res(true);
        });
      } catch (err) {
        console.error('Could not save videos to DB:', err);
      }
    }

    async function loadSavedVideosFromPhoneDB() {
      try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        return new Promise((resolve) => {
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        });
      } catch (e) {
        return [];
      }
    }

    // --- LOAD AND CONTROL PLAYLIST ---
    function loadTrack(index, autoPlay = false) {
      if (!playlist.length) return;
      currentIndex = (index + playlist.length) % playlist.length;
      const item = playlist[currentIndex];

      videoPlayer.src = item.url;
      const positionText = `Video ${currentIndex + 1} of ${playlist.length}: ${item.title}`;
      trackTitle.textContent = positionText;

      updateAriaLabels();

      if (autoPlay) {
        videoPlayer.play().then(() => {
          updatePlayButtonUI(true);
          announce(`Playing ${positionText}`);
        }).catch(() => {
          updatePlayButtonUI(false);
        });
      } else {
        updatePlayButtonUI(false);
        announce(`Loaded ${positionText}`);
      }
    }

    function updatePlayButtonUI(isPlaying) {
      const item = playlist[currentIndex] || { title: 'Video' };
      if (isPlaying) {
        playIcon.textContent = '⏸';
        playLabel.textContent = 'Pause';
        playPauseBtn.setAttribute('aria-label', `Pause. Currently playing Video ${currentIndex + 1} of ${playlist.length}: ${item.title}`);
      } else {
        playIcon.textContent = '▶';
        playLabel.textContent = 'Play';
        playPauseBtn.setAttribute('aria-label', `Play Video ${currentIndex + 1} of ${playlist.length}: ${item.title}`);
      }
    }

    function updateAriaLabels() {
      if (!playlist.length) return;
      const prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      const nextIndex = (currentIndex + 1) % playlist.length;

      prevBtn.setAttribute('aria-label', `Previous Video. Go to Video ${prevIndex + 1}: ${playlist[prevIndex].title}`);
      nextBtn.setAttribute('aria-label', `Next Video. Go to Video ${nextIndex + 1}: ${playlist[nextIndex].title}`);
      updatePlayButtonUI(!videoPlayer.paused);
    }

    // --- CENTER BUTTON EVENTS ---
    playPauseBtn.addEventListener('click', () => {
      if (videoPlayer.paused) {
        playTone(660, 0.08);
        videoPlayer.play();
        updatePlayButtonUI(true);
        announce(`Playing ${playlist[currentIndex].title}`);
      } else {
        playTone(440, 0.08);
        videoPlayer.pause();
        updatePlayButtonUI(false);
        announce(`Paused ${playlist[currentIndex].title}`);
      }
    });

    prevBtn.addEventListener('click', () => {
      playTone(480, 0.08);
      loadTrack(currentIndex - 1, true);
    });

    nextBtn.addEventListener('click', () => {
      playTone(720, 0.08);
      loadTrack(currentIndex + 1, true);
    });

    videoPlayer.addEventListener('ended', () => {
      loadTrack(currentIndex + 1, true);
    });

    // --- HANDLE PHONE VIDEO / FOLDER SELECTION ---
    async function handleSelectedFiles(fileList) {
      const validVideos = Array.from(fileList).filter(file =>
        file.type.startsWith('video/') ||
        file.type.startsWith('audio/') ||
        /\.(mp4|mkv|webm|mov|avi|3gp|mp3|m4a|wav)$/i.test(file.name)
      );

      if (validVideos.length === 0) {
        announce('No video files found in selection. Please try again.');
        alert('No video files were found in your selection.');
        return;
      }

      // Sort alphabetically so order is predictable for blind user
      validVideos.sort((a, b) => a.name.localeCompare(b.name));

      playlist = validVideos.map(file => ({
        title: file.name.replace(/\.[^/.]+$/, ""),
        url: URL.createObjectURL(file),
        isSample: false
      }));

      // Save to IndexedDB so they auto-load next time the app opens!
      await saveVideosToPhoneDB(validVideos);

      loadTrack(0, true);
      announce(`Loaded and saved ${validVideos.length} videos from phone. They will load automatically every time you open the app.`);
    }

    pickVideosBtn.addEventListener('click', () => {
      videoInput.value = '';
      videoInput.click();
    });

    pickFolderBtn.addEventListener('click', () => {
      folderInput.value = '';
      folderInput.click();
    });

    videoInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleSelectedFiles(e.target.files);
      }
    });

    folderInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files.length > 0) {
        handleSelectedFiles(e.target.files);
      }
    });

    // --- SPEAK TIME & INFO ---
    function formatSeconds(sec) {
      if (!sec || isNaN(sec)) return '0 minutes';
      const mins = Math.floor(sec / 60);
      const secs = Math.floor(sec % 60);
      return `${mins} minutes ${secs} seconds`;
    }

    speakInfoBtn.addEventListener('click', () => {
      const item = playlist[currentIndex];
      const current = formatSeconds(videoPlayer.currentTime);
      const total = formatSeconds(videoPlayer.duration);
      const msg = `Video ${currentIndex + 1} of ${playlist.length}: ${item.title}. Position: ${current} out of ${total}.`;
      announce(msg);

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(msg);
        window.speechSynthesis.speak(utter);
      }
    });

    // --- CLEAR SAVED VIDEOS ---
    clearSavedBtn.addEventListener('click', async () => {
      const db = await openDB();
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).clear();
      playlist = [...SAMPLE_VIDEOS];
      loadTrack(0, false);
      announce('Cleared saved phone videos. Loaded default sample videos.');
    });

    // --- STARTUP: AUTO-LOAD SAVED VIDEOS FROM PHONE DATABASE ---
    window.addEventListener('DOMContentLoaded', async () => {
      const savedRecords = await loadSavedVideosFromPhoneDB();
      if (savedRecords.length > 0) {
        playlist = savedRecords.map(rec => ({
          title: rec.title,
          url: URL.createObjectURL(rec.blob),
          isSample: false
        }));
        loadTrack(0, false);
        announce(`Automatically loaded ${playlist.length} saved phone videos. Ready to play.`);
      } else {
        playlist = [...SAMPLE_VIDEOS];
        loadTrack(0, false);
      }
    });
  </script>
</body>
</html>
