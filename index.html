<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Blind Video Player</title>
  <style>
    :root {
      --bg: #000000;
      --card: #121212;
      --yellow: #FFD600;
      --white: #FFFFFF;
      --cyan: #00E5FF;
      --green: #00E676;
      --border: 4px solid #FFD600;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--white);
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    header {
      padding: 12px 14px;
      background: var(--card);
      border-bottom: 3px solid #333;
      text-align: center;
    }

    #trackTitle {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--yellow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-container {
      width: 100%;
      height: 24dvh;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #222;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    main.center-controls {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 12px;
      padding: 14px 12px;
      align-items: stretch;
    }

    .ctrl-btn {
      background: var(--card);
      color: var(--white);
      border: var(--border);
      border-radius: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 900;
      cursor: pointer;
      padding: 10px;
    }

    .ctrl-btn .icon {
      font-size: 3rem;
      line-height: 1;
    }

    .ctrl-btn .label {
      font-size: 1.35rem;
      text-transform: uppercase;
      text-align: center;
    }

    #playPauseBtn {
      background: var(--yellow);
      color: #000000;
      border: 5px solid var(--white);
    }

    #playPauseBtn .icon {
      font-size: 3.8rem;
    }

    #playPauseBtn .label {
      font-size: 1.65rem;
    }

    .ctrl-btn:focus-visible, .ctrl-btn:active {
      outline: 6px solid var(--cyan);
      transform: scale(0.98);
    }

    footer {
      padding: 10px 12px 14px;
      background: var(--card);
      border-top: 3px solid #333;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 10px;
    }

    .bottom-btn {
      background: #1A1A1A;
      color: var(--green);
      border: 3px solid var(--green);
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .rescan-btn {
      color: var(--cyan);
      border-color: var(--cyan);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>

  <div id="liveAnnouncer" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <header>
    <div id="trackTitle" aria-live="polite">Loading phone videos...</div>
  </header>

  <div class="video-container">
    <video id="videoPlayer" playsinline preload="metadata"></video>
  </div>

  <main class="center-controls" role="region" aria-label="Main Video Controls">
    <button type="button" id="prevBtn" class="ctrl-btn" aria-label="Previous Video">
      <span class="icon" aria-hidden="true">⏮</span>
      <span class="label">Previous</span>
    </button>

    <button type="button" id="playPauseBtn" class="ctrl-btn" aria-label="Play Video">
      <span class="icon" id="playIcon" aria-hidden="true">▶</span>
      <span class="label" id="playLabel">Play</span>
    </button>

    <button type="button" id="nextBtn" class="ctrl-btn" aria-label="Next Video">
      <span class="icon" aria-hidden="true">⏭</span>
      <span class="label">Next</span>
    </button>
  </main>

  <footer>
    <button type="button" id="speakInfoBtn" class="bottom-btn" aria-label="Speak current video name and time progress">
      🔊 Speak Info
    </button>
    <button type="button" id="rescanBtn" class="bottom-btn rescan-btn" aria-label="Scan phone for videos">
      🔄 Scan Videos
    </button>
  </footer>

  <script>
    let playlist = [];
    let currentIndex = 0;

    const videoPlayer = document.getElementById('videoPlayer');
    const prevBtn = document.getElementById('prevBtn');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = document.getElementById('playIcon');
    const playLabel = document.getElementById('playLabel');
    const nextBtn = document.getElementById('nextBtn');
    const trackTitle = document.getElementById('trackTitle');
    const liveAnnouncer = document.getElementById('liveAnnouncer');
    const speakInfoBtn = document.getElementById('speakInfoBtn');
    const rescanBtn = document.getElementById('rescanBtn');

    function playTone(freq = 520, duration = 0.08) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        gain.gain.value = 0.12;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function announce(message) {
      liveAnnouncer.textContent = '';
      setTimeout(() => {
        liveAnnouncer.textContent = message;
      }, 50);
    }

    function loadPhoneVideos() {
      // Call Native Android Java MediaStore Bridge
      if (window.AndroidBridge && typeof window.AndroidBridge.getVideos === 'function') {
        try {
          const jsonStr = window.AndroidBridge.getVideos();
          const list = JSON.parse(jsonStr);

          if (list && list.length > 0) {
            playlist = list.map(item => ({
              title: item.title,
              // Convert native file path into Capacitor playable stream URL
              url: window.Capacitor ? window.Capacitor.convertFileSrc(item.path) : item.path
            }));
            loadTrack(0, false);
            announce(`Loaded ${playlist.length} videos from phone. Double tap center button to play.`);
            return;
          } else {
            trackTitle.textContent = "Tap Scan Videos & Allow Permission";
            announce("Please allow video permission on screen, then tap Scan Videos.");
            window.AndroidBridge.askPermission();
            return;
          }
        } catch (err) {
          console.error(err);
        }
      }

      // Fallback only if opened in normal desktop browser
      playlist = [
        {
          title: "Sample 1 - Nature Stream",
          url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
        },
        {
          title: "Sample 2 - Coastal Waves",
          url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4"
        }
      ];
      loadTrack(0, false);
    }

    // Called automatically by Android Java as soon as permission is granted!
    window.onPermissionGranted = function() {
      loadPhoneVideos();
    };

    function loadTrack(index, autoPlay = false) {
      if (!playlist.length) return;
      currentIndex = (index + playlist.length) % playlist.length;
      const item = playlist[currentIndex];

      videoPlayer.src = item.url;
      videoPlayer.load();

      const positionText = `Video ${currentIndex + 1} of ${playlist.length}: ${item.title}`;
      trackTitle.textContent = positionText;
      updateAriaLabels();

      if (autoPlay) {
        videoPlayer.play().then(() => {
          updatePlayButtonUI(true);
          announce(`Playing ${positionText}`);
        }).catch((err) => {
          updatePlayButtonUI(false);
          announce(`Selected ${positionText}. Tap Play.`);
        });
      } else {
        updatePlayButtonUI(false);
        announce(`Ready: ${positionText}`);
      }
    }

    function updatePlayButtonUI(isPlaying) {
      if (!playlist.length) return;
      const item = playlist[currentIndex];
      if (isPlaying) {
        playIcon.textContent = '⏸';
        playLabel.textContent = 'Pause';
        playPauseBtn.setAttribute('aria-label', `Pause. Playing Video ${currentIndex + 1} of ${playlist.length}: ${item.title}`);
      } else {
        playIcon.textContent = '▶';
        playLabel.textContent = 'Play';
        playPauseBtn.setAttribute('aria-label', `Play Video ${currentIndex + 1} of ${playlist.length}: ${item.title}`);
      }
    }

    function updateAriaLabels() {
      if (!playlist.length) return;
      const prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      const nextIndex = (currentIndex + 1) % playlist.length;

      prevBtn.setAttribute('aria-label', `Previous Video. Go to Video ${prevIndex + 1}: ${playlist[prevIndex].title}`);
      nextBtn.setAttribute('aria-label', `Next Video. Go to Video ${nextIndex + 1}: ${playlist[nextIndex].title}`);
      updatePlayButtonUI(!videoPlayer.paused);
    }

    playPauseBtn.addEventListener('click', () => {
      if (!playlist.length) {
        loadPhoneVideos();
        return;
      }
      if (videoPlayer.paused) {
        playTone(660, 0.08);
        videoPlayer.play().then(() => {
          updatePlayButtonUI(true);
          announce(`Playing ${playlist[currentIndex].title}`);
        }).catch(() => {
          announce(`Cannot play this video format, skipping to next.`);
        });
      } else {
        playTone(440, 0.08);
        videoPlayer.pause();
        updatePlayButtonUI(false);
        announce(`Paused ${playlist[currentIndex].title}`);
      }
    });

    prevBtn.addEventListener('click', () => {
      if (!playlist.length) return;
      playTone(480, 0.08);
      loadTrack(currentIndex - 1, true);
    });

    nextBtn.addEventListener('click', () => {
      if (!playlist.length) return;
      playTone(720, 0.08);
      loadTrack(currentIndex + 1, true);
    });

    videoPlayer.addEventListener('ended', () => {
      loadTrack(currentIndex + 1, true);
    });

    speakInfoBtn.addEventListener('click', () => {
      if (!playlist.length) {
        announce("No videos loaded yet. Tap Scan Videos.");
        return;
      }
      const item = playlist[currentIndex];
      const mins = Math.floor((videoPlayer.currentTime || 0) / 60);
      const secs = Math.floor((videoPlayer.currentTime || 0) % 60);
      const msg = `Video ${currentIndex + 1} of ${playlist.length}: ${item.title}. Elapsed: ${mins} minutes ${secs} seconds.`;
      announce(msg);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(msg));
      }
    });

    rescanBtn.addEventListener('click', () => {
      playTone(600, 0.08);
      loadPhoneVideos();
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(loadPhoneVideos, 500);
    });
  </script>
</body>
</html>
