name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Dependencies and Inject Native Android Video Scanner
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm install
          npx cap add android
          sed -i 's/<application/<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"\/><uses-permission android:name="android.permission.READ_MEDIA_VIDEO"\/><application android:requestLegacyExternalStorage="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/java/com/ramu/blindplayer/MainActivity.java
          package com.ramu.blindplayer;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import org.json.JSONArray;
          import org.json.JSONObject;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new VideoBridge(), "AndroidBridge");
                  checkAndAskPermission();
              }
              private void checkAndAskPermission() {
                  String perm = Build.VERSION.SDK_INT >= 33 ? "android.permission.READ_MEDIA_VIDEO" : Manifest.permission.READ_EXTERNAL_STORAGE;
                  if (ContextCompat.checkSelfPermission(this, perm) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, new String[]{perm, Manifest.permission.READ_EXTERNAL_STORAGE}, 101);
                  }
              }
              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript("if(window.onPermissionGranted) window.onPermissionGranted();", null));
              }
              public class VideoBridge {
                  @JavascriptInterface
                  public void askPermission() {
                      checkAndAskPermission();
                  }
                  @JavascriptInterface
                  public String getVideos() {
                      JSONArray arr = new JSONArray();
                      try {
                          String[] proj = { MediaStore.Video.Media.DISPLAY_NAME, MediaStore.Video.Media.DATA };
                          Cursor cursor = getContentResolver().query(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, proj, null, null, MediaStore.Video.Media.DATE_ADDED + " DESC");
                          if (cursor != null) {
                              while (cursor.moveToNext()) {
                                  String name = cursor.getString(0);
                                  String path = cursor.getString(1);
                                  if (path != null && !path.isEmpty()) {
                                      JSONObject obj = new JSONObject();
                                      obj.put("title", name != null ? name.replaceFirst("[.][^.]+$", "") : "Video");
                                      obj.put("path", "file://" + path);
                                      arr.put(obj);
                                  }
                              }
                              cursor.close();
                          }
                      } catch (Exception e) {}
                      return arr.toString();
                  }
              }
          }
          EOF
          npx cap sync android
      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Blind-Video-Player-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
